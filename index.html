
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050b14; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .text { position: relative; z-index: 10; font-size: 24px; font-weight: bold; color: #ffd700; text-align: center; text-shadow: 0 0 10px rgba(255,215,0,0.8); padding: 20px; }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="text">DAY 1: THE OCEAN DIDN'T RISE.<br>THEY CAME UP.</div>

    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('bg');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let particles = Array.from({length: 40}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 3 + 1,
                d: Math.random() * 1 + 0.5
            }));

            function draw() {
                ctx.fillStyle = 'rgba(5, 11, 20, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#00f3ff';
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    p.y -= p.d;
                    if(p.y < 0) p.y = canvas.height;
                });

                requestAnimationFrame(draw);
            }
            draw();
        });
    </script>
</body>
</html>
